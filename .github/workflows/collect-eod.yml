name: Collect Taiwan after-close data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect-eod.yml'
      - 'scripts/collect-eod.mjs'
      - 'lib/eod-radar.ts'
      - 'lib/eod-history.ts'
      - 'lib/after-close-timing.ts'
  schedule:
    # Taipei 08:37 retry, 15:15, 17:27 and 20:27. GitHub may delay runs.
    - cron: '37 0 * * *'
    - cron: '15 7 * * *'
    - cron: '27 9,12 * * *'
permissions:
  contents: write
concurrency:
  group: eod-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Collect official data
        id: collect
        continue-on-error: true
        run: node --experimental-strip-types scripts/collect-eod.mjs
      - name: Save collected market data
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'stock-radar-data-bot'
          git config user.email 'stock-radar-data-bot@users.noreply.github.com'
          git add -- data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Save official after-close observations'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraHeader=Authorization: Basic $AUTH" push "https://github.com/$REPOSITORY.git" "HEAD:$DEFAULT_BRANCH"
      - name: Report partial collection failure
        if: steps.collect.outcome == 'failure'
        run: exit 1
